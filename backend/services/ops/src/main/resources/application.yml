server.port: ${OPS_PORT:8082}
spring:
  application:
    name: sentinel-ops
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${SPRING_DATASOURCE_USERNAME:sentinel}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    table: ops_schema_history
    baseline-on-migrate: true
    baseline-version: "1"
    ignore-missing-migrations: true
    locations: classpath:db/migration
management.endpoints.web.exposure.include: health
management.endpoint.health.probes.enabled: true
sentinel:
  security:
    token-hmac-key: ${IDENTITY_TOKEN_HMAC_KEY:local-m2-simulation-hmac-key-not-for-production}
  outbox:
    table: risk.outbox_events
    max-attempts: 5
    backoff-base-ms: 200
    claim-timeout-seconds: 30
    batch-size: 25
    relay:
      poll-enabled: true
      poll-interval-ms: 1000
