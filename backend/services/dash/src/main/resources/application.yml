server.port: ${DASH_PORT:8083}
spring:
  application:
    name: sentinel-dash
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${SPRING_DATASOURCE_USERNAME:sentinel}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    table: dash_schema_history
    baseline-on-migrate: true
    baseline-version: "1"
    ignore-missing-migrations: true
    locations: classpath:db/migration
management.endpoints.web.exposure.include: health
management.endpoint.health.probes.enabled: true
sentinel:
  security:
    token-hmac-key: ${IDENTITY_TOKEN_HMAC_KEY:local-m2-simulation-hmac-key-not-for-production}
  bff:
    identity-base-url: ${DASH_IDENTITY_BASE_URL:}
    ops-base-url: ${DASH_OPS_BASE_URL:}
    ai-base-url: ${DASH_AI_BASE_URL:}
    platform-base-url: ${DASH_PLATFORM_BASE_URL:}
