components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationIdHeader:
      name: X-Organization-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlagKey:
      name: flagKey
      in: path
      required: true
      schema:
        type: string
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScreeningId:
      name: screeningId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QueueType:
      name: queueType
      in: path
      required: true
      schema:
        type: string
    WidgetId:
      name: widgetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceChannel:
      name: channel
      in: path
      required: true
      schema:
        type: string
        enum:
        - workspace
        - alerts
        - cases
        - queues
      description: DASH refresh channel per DASH-FR-011
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
      description: SSE reconnection cursor
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ResponseMeta:
      type: object
      required:
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
          format: uuid
        correlationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        pagination:
          type: object
          properties:
            cursor:
              type: string
            hasMore:
              type: boolean
            limit:
              type: integer
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          - timestamp
          properties:
            code:
              type: string
              example: ALERT_VALIDATION_001
            message:
              type: string
            requestId:
              type: string
              format: uuid
            correlationId:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time
            retryable:
              type: boolean
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    GenericRequest:
      type: object
    GenericDataResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EmptyDataResponse:
      type: object
      properties:
        data:
          type: object
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    HealthResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/HealthStatus'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    HealthStatus:
      type: object
      properties:
        status:
