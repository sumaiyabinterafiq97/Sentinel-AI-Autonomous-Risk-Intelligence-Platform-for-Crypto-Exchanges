openapi: 3.0.3
info:
  title: Sentinel AI Platform API
  description: |-
    Contract-first REST API for Sentinel AI — Autonomous Risk Intelligence Platform for Crypto Exchanges.
    Phase 4 — full MVP coverage per APIInventory.md. Multi-method inventory rows are expanded to
    separate HTTP operations. V2 operations tagged explicitly.
    Authoritative inventory: docs/06-api/APIInventory.md
  version: 1.1.0
  contact:
    name: Sentinel AI Architecture Team
servers:
- url: https://api.example.com
  description: Environment-neutral placeholder (replace per deployment)
tags:
- name: Platform
  description: CORE platform health and configuration
- name: Authentication
  description: AUTH domain — sessions and login
- name: Authorization
  description: AUTHZ domain — roles and permissions
- name: Users
  description: USER domain
- name: Organizations
  description: ORG domain
- name: Alerts
  description: ALERT domain — operational alert lifecycle
- name: Risk
  description: RISK domain — scoring and rules
- name: Investigations
  description: INVEST domain — cases and evidence
- name: Compliance
  description: COMP domain
- name: Workspace
  description: DASH presentation layer
- name: AI
  description: AI Platform — assistive only
- name: Administration
  description: ADMIN domain
- name: Security
  description: SEC domain (V2)
- name: Reports
  description: REPORT domain (V2)
security:
- bearerAuth: []
paths:
  /v1/platform/health:
    get:
      tags:
      - Platform
      summary: Platform liveness and readiness check
      operationId: getPlatformHealth
      x-release: MVP
      x-api-id: API-CORE-001
      x-fr:
      - CORE-FR-004
      security: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/platform/status:
